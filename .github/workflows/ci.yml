# CI — corre en cada push y en cada Pull Request. No despliega nada: el
# deploy sigue siendo de Cloudflare Workers Builds al mergear a main.
# En Linux el build completo (incluido el service worker) pasa: el fallo
# del SW por el apóstrofo de "App's" es solo de la máquina local.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests
        run: npm test
      - name: Lint
        run: npm run lint
      # Sin VITE_SUPABASE_*: la app compila igual y cae al MENU local.
      - name: Build
        run: npm run build
