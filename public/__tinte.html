<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;background:#131A17;font:11px system-ui;color:#8AA096}
.row{display:flex;flex-wrap:wrap;gap:4px}
figure{margin:0}figcaption{text-align:center;padding:3px}
</style></head>
<body>
<div class="row" id="row"></div>
<script type="module">
/* Banco de pruebas: replica la escena exacta del simulador de Lab con varios
   tintes de cono y mide el contraste espiral-vs-cono de cada uno, para elegir
   el tono con datos en vez de iterar a ojo por la app. */
import * as THREE from '/node_modules/three/build/three.module.js';
import { GLTFLoader } from '/node_modules/three/examples/jsm/loaders/GLTFLoader.js';
import { MeshoptDecoder } from '/node_modules/three/examples/jsm/libs/meshopt_decoder.module.js';
import { RoomEnvironment } from '/node_modules/three/examples/jsm/environments/RoomEnvironment.js';

// Constantes copiadas de src/lib/espiral3d.jsx
const TUBULAR = 160, RADIAL = 8, MODELO_RADIO = 92, ESCALA = 58, Y_REL = .75;
const ELEV = 50 * Math.PI / 180, DIST = 320, MIRA_Y = 14, TAM = 230;
// Tema oscuro (PALETAS.oscuro)
const CARD = '#131A17', LINE = '#243029', BRAND = '#7FE3C0', ACENTO = '#C9873A';

const CANDIDATOS = ['#CFC3AE', '#B3A695', '#9A8E80', '#877C70', '#746A5F', '#615950'];

class Esp extends THREE.Curve {
  constructor(v, r, e, a) { super(); Object.assign(this, { v, r, e, a }); }
  getPoint(t, o = new THREE.Vector3()) {
    const ang = t * this.v * Math.PI * 2, rad = t * this.e * this.r;
    return o.set(Math.cos(ang) * rad, this.a, Math.sin(ang) * rad);
  }
}

const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const gltf = await loader.loadAsync('/models/espiral.glb');

const rel = (r, g, b) => { const f = (c) => { c /= 255; return c <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4; };
  return .2126 * f(r) + .7152 * f(g) + .0722 * f(b); };
const lum = (r, g, b) => .2126 * r + .7152 * g + .0722 * b;
const cr = (a, b) => { const [x, y] = a > b ? [a, b] : [b, a]; return +((x + .05) / (y + .05)).toFixed(2); };

const row = document.getElementById('row');
const resultados = {};

for (const tinte of CANDIDATOS) {
  const r = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
  r.setSize(TAM, TAM); r.setPixelRatio(2);
  r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 1;
  r.setClearColor(CARD, 1);

  const sc = new THREE.Scene();
  const pm = new THREE.PMREMGenerator(r);
  sc.environment = pm.fromScene(new RoomEnvironment(), .04).texture;
  sc.environmentIntensity = .4;
  sc.add(new THREE.AmbientLight(0xffffff, .25));
  const sol = new THREE.DirectionalLight(0xffffff, .8); sol.position.set(70, 150, 90); sc.add(sol);

  // Cono, encuadrado y tinteado igual que tenirModelo()
  const m = gltf.scene.clone(true);
  const caja = new THREE.Box3().setFromObject(m);
  const c = caja.getCenter(new THREE.Vector3()), t = caja.getSize(new THREE.Vector3());
  const s = MODELO_RADIO / (Math.max(t.x, t.z) / 2);
  m.scale.setScalar(s); m.position.set(-c.x * s, -c.y * s, -c.z * s);
  m.traverse((h) => {
    if (!h.material) return;
    const mats = Array.isArray(h.material) ? h.material : [h.material];
    mats.forEach((mm) => { if (!mm.color) return; mm.map = null; mm.color.set(tinte); mm.needsUpdate = true; });
  });
  sc.add(m);
  const altura = (t.y * s) / 2 * Y_REL;

  // Espiral revelada al 100%, como se ve al entrar a Lab
  const curva = new Esp(4.2, 1, ESCALA, altura);
  const matAct = new THREE.MeshStandardMaterial({ roughness: .4, emissiveIntensity: .18 });
  matAct.color.set(BRAND); matAct.emissive.set(BRAND);
  sc.add(new THREE.Mesh(new THREE.TubeGeometry(curva, TUBULAR, 2.6, RADIAL, false), matAct));
  const matGuia = new THREE.MeshStandardMaterial({ roughness: .6, transparent: true, opacity: .35 });
  matGuia.color.set(LINE);
  sc.add(new THREE.Mesh(new THREE.TubeGeometry(curva, TUBULAR, 2, RADIAL, false), matGuia));
  const gota = new THREE.Mesh(new THREE.SphereGeometry(4, 16, 16),
    new THREE.MeshStandardMaterial({ emissiveIntensity: 1.3, roughness: .3 }));
  gota.material.color.set(ACENTO); gota.material.emissive.set(ACENTO);
  gota.position.copy(curva.getPointAt(1)); sc.add(gota);

  const cam = new THREE.PerspectiveCamera(38, 1, 1, 2000);
  cam.position.set(0, Math.sin(ELEV) * DIST, Math.cos(ELEV) * DIST);
  cam.lookAt(0, MIRA_Y, 0);
  r.render(sc, cam);

  const fig = document.createElement('figure');
  fig.appendChild(r.domElement);
  const cap = document.createElement('figcaption'); cap.textContent = tinte; fig.appendChild(cap);
  row.appendChild(fig);

  // Clasificación: menta (verde dominante) vs cono (neutro, fuera del fondo)
  const gl = r.getContext(), w = TAM * 2, h = TAM * 2;
  const buf = new Uint8Array(w * h * 4);
  gl.readPixels(0, 0, w, h, gl.RGBA, gl.UNSIGNED_BYTE, buf);
  const esp = [], cono = [];
  for (let i = 0; i < buf.length; i += 4) {
    const [R, G, B] = [buf[i], buf[i + 1], buf[i + 2]];
    const L = lum(R, G, B), sat = Math.max(R, G, B) - Math.min(R, G, B);
    if (G === Math.max(R, G, B) && G - R > 14 && sat > 18) esp.push([R, G, B]);
    else if (sat < 16 && L > 28) cono.push([R, G, B]);   // >28 excluye el fondo #131A17
  }
  const prom = (a) => a.reduce((s2, p) => [s2[0] + p[0], s2[1] + p[1], s2[2] + p[2]], [0, 0, 0]).map((v) => v / a.length);
  const e = prom(esp), co = prom(cono);
  resultados[tinte] = {
    espiralLum: +lum(...e).toFixed(0),
    conoLum: +lum(...co).toFixed(0),
    espiralVsCono: cr(rel(...e), rel(...co)),
    conoVsFondo: cr(rel(...co), rel(0x13, 0x1A, 0x17)),
  };
  r.dispose();
}
window.__info = resultados;
window.__done = true;
</script>
</body></html>
